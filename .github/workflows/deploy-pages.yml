name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "games/terrario-isopodos/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/terrario-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/terrario-isopodos
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/terrario-isopodos/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser interaction smoke test
        run: node tests/browser-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrario-pages-evidence-${{ github.sha }}
          path: games/terrario-isopodos/artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/terrario-isopodos/package-lock.json
      - name: Build production game
        working-directory: games/terrario-isopodos
        run: |
          npm ci
          npm run build
      - name: Assemble complete Pages site
        run: |
          mkdir site
          git archive HEAD | tar -x -C site
          rm -rf site/games/terrario-isopodos/*
          cp -a games/terrario-isopodos/dist/. site/games/terrario-isopodos/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
