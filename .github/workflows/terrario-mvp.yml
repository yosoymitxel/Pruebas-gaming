name: Terrario MVP checks

on:
  push:
    branches:
      - feat/isopod-render-spike
    paths:
      - "games/terrario-isopodos/**"
      - ".github/workflows/terrario-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrario-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/terrario-isopodos
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/terrario-isopodos/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
